# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions
#
# Release channels
#   pull request          -> verify only, nothing is published
#   push to main          -> release candidate 1.0.<run>-rc on npm dist-tag `next`
#                            (environment: Staging). `latest` and the CDN are not touched.
#   manual run on main    -> promotes 1.0.<N>-rc to 1.0.<N> on npm
#                            dist-tag `latest`, then updates the CDN (environment: Production).
#                            Actions -> Node.js Build -> Run workflow -> "Use workflow from": main,
#                            "Release candidate to promote": 1.0.<N>-rc
#
# The promotion does not rebuild: it takes the RC tarball from the npm registry,
# changes only the version number and publishes it, so what was tested is what ships.

name: Node.js Build

env:
  # Push to main: a new release candidate. Manual run: the release candidate being promoted.
  # update MAJOR and MINOR version here
  RC_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || format('1.0.{0}-rc', github.run_number) }}

  # Pinned, as it runs in jobs that can publish. Needs >= 11.5.1 for Trusted Publishing.
  NPM_CLI: 'npm@11.21.2'

  NPM_PACKAGE: '@ezeep/ezeep-js'                   # npm package name
  NPM_PACKAGE_NG: '@ezeep/ngx-ezeep-js'            # angular npm package name

  DIST_PATH: 'dist/ezeep'                          # deployment path
  ARTIFACT_NAME: 'ezeep-js.zip'                    # artifact name

  DIST_PATH_NG: 'dist/directives'                  # angular directives deployment path
  ARTIFACT_NAME_NG: 'ng-directives.zip'            # angular directives artifact name

  NPM_REGISTRY: 'https://registry.npmjs.org'       # npm registry url

  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true         # suppress node 20 deprecation warnings

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Promotion of a release candidate to production. Must be started from main.
  workflow_dispatch:
    inputs:
      version:
        description: 'Release candidate to promote (e.g. 1.0.300-rc)'
        required: true
        type: string

jobs:
  # Validation gate: lint + unit tests + build. Runs on every PR and push, and
  # never publishes. Keeps regressions out of main.
  verify:
    # A promotion re-publishes an already verified RC, so there is nothing to build.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup Node.js 22
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Unit tests
      run: npm test

    - name: E2E tests (headless Chromium)
      run: npm run test.e2e

    - name: Build
      run: npm run build

  # ---------------------------------------------------------------------------
  # Stage 1 - release candidate (npm dist-tag `next`)
  # ---------------------------------------------------------------------------
  rc-npm:
    # Only publish on a real push to main, never on pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    environment: Staging
    runs-on: ubuntu-latest
    # NEU: Erforderlich für Trusted Publishing
    permissions:
      contents: write
      id-token: write

    steps:
    - name: Checkout main branch
      uses: actions/checkout@v5

    - name: Setup Node.js 22
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        registry-url: "${{ env.NPM_REGISTRY }}"
        cache: 'npm'

    - name: Bump package.json version of npm package
      run: npm version --no-git-tag-version --allow-same-version "${RC_VERSION}"

    - name: Build
      run: |
        npm ci
        npm run build

    - name: Publish release candidate to npm registry (dist-tag next)
      # npx -p sorgt dafür, dass eine OIDC-fähige npm-Version geladen wird (Trusted Publishing)
      # A pre-release version with --tag next never becomes `latest` and is not
      # matched by semver ranges such as ^1.0.0, so existing consumers do not get it.
      run: |
        if [ -n "$(npm view "${NPM_PACKAGE}@${RC_VERSION}" version 2>/dev/null || true)" ]; then
          echo "${NPM_PACKAGE}@${RC_VERSION} is already published - skipping."
          exit 0
        fi
        npx -p "${NPM_CLI}" npm publish --access public --provenance --tag next

    - name: Upload npm artifact
      uses: actions/upload-artifact@v5
      with:
        path: ${{ env.DIST_PATH }}
        name: ${{ env.ARTIFACT_NAME }}

    - name: Upload ng directives artifacts
      uses: actions/upload-artifact@v5
      with:
        path: ${{ env.DIST_PATH_NG }}
        name: ${{ env.ARTIFACT_NAME_NG }}

    - name: Zip npm artifact for release
      uses: thedoctor0/zip-release@b57d897cb5d60cb78b51a507f63fa184cfe35554 # 0.7.6
      with:
        type: 'zip'
        directory: ${{ env.DIST_PATH }}
        path: '.'
        filename: ${{ env.ARTIFACT_NAME }}

    - name: Create pre-release with npm package
      # The tag created here is what a promotion run is started from.
      uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
      with:
        tag: "${{ env.RC_VERSION }}"
        commit: ${{ github.sha }}
        prerelease: true
        allowUpdates: true
        artifacts: "${{ env.DIST_PATH }}/${{ env.ARTIFACT_NAME }}"
        token: ${{ secrets.GITHUB_TOKEN }}


  rc-ng:
    environment: Staging
    needs: rc-npm
    runs-on: ubuntu-latest
    # NEU: Erforderlich für Trusted Publishing
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout angular branch
      uses: actions/checkout@v5
      with:
        ref: ngx-ezeep-js

    - name: Setup Node.js 22
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        registry-url: "${{ env.NPM_REGISTRY }}"
        cache: 'npm'
        cache-dependency-path: 'ezeep-js-angular/projects/ngx-ezeep-js'

    - name: Bump package.json version for angular component
      # The RC of the angular module is pinned to the matching RC of the npm
      # package. The range in package.json (^1.0.x) can never resolve to a
      # pre-release, so without the pin it would pull in the current `latest`.
      run: |
        npm version --no-git-tag-version --allow-same-version "${RC_VERSION}"
        npm pkg set "dependencies.${NPM_PACKAGE}=${RC_VERSION}"
      working-directory: ezeep-js-angular/projects/ngx-ezeep-js

    - name: download angular build artifact
      uses: actions/download-artifact@v5
      with:
          name: ${{ env.ARTIFACT_NAME_NG }}
          path: ezeep-js-angular/projects/ngx-ezeep-js/src/lib

    - name: Wait for the npm release candidate to be installable
      run: |
        for attempt in $(seq 1 30); do
          if [ -n "$(npm view "${NPM_PACKAGE}@${RC_VERSION}" version 2>/dev/null || true)" ]; then
            exit 0
          fi
          echo "Waiting for ${NPM_PACKAGE}@${RC_VERSION} (${attempt}/30)"
          sleep 10
        done
        echo "::error::${NPM_PACKAGE}@${RC_VERSION} did not appear on the npm registry."
        exit 1

    - name: build angular library and publish (dist-tag next)
      run: |
        cd ezeep-js-angular
        npm install -g @angular/cli
        npm install
        cd projects/ngx-ezeep-js
        npm install
        cd ../..
        ng build ngx-ezeep-js
        cd dist/ngx-ezeep-js
        if [ -n "$(npm view "${NPM_PACKAGE_NG}@${RC_VERSION}" version 2>/dev/null || true)" ]; then
          echo "${NPM_PACKAGE_NG}@${RC_VERSION} is already published - skipping."
          exit 0
        fi
        # Hier ebenfalls npx nutzen, um die OIDC-kompatible npm Version zu erzwingen
        npx -p "${NPM_CLI}" npm publish --access public --provenance --tag next

  # ---------------------------------------------------------------------------
  # Stage 2 - production (npm dist-tag `latest` + CDN), manual, from an RC tag
  # ---------------------------------------------------------------------------
  # One job, so a promotion needs one approval of the Production environment
  # and never stops halfway between npm and the CDN while waiting for another.
  promote:
    if: github.event_name == 'workflow_dispatch'
    environment: Production
    # Two promotions at once could both pass the "not older than latest" check.
    concurrency:
      group: promote
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Trusted Publishing (npm) and the Azure login both need the OIDC token
    permissions:
      contents: write
      id-token: write

    steps:
    - name: Setup Node.js 22
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        registry-url: "${{ env.NPM_REGISTRY }}"

    - name: Resolve release version and commit
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
          echo "::error::A promotion must be started from main, not from '${GITHUB_REF_NAME}'."
          exit 1
        fi
        if [[ ! "${RC_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc$ ]]; then
          echo "::error::'${RC_VERSION}' is not a release candidate (e.g. 1.0.300-rc)."
          exit 1
        fi
        release_version="${RC_VERSION%-rc}"

        # The GitHub release is created on the commit the release candidate was built from.
        if ! rc_commit="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RC_VERSION}" --jq .sha)"; then
          echo "::error::There is no tag ${RC_VERSION}."
          exit 1
        fi
        status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${rc_commit}...main" --jq .status)"
        if [[ "${status}" != "ahead" && "${status}" != "identical" ]]; then
          echo "::error::${RC_VERSION} (${rc_commit}) was not built from main."
          exit 1
        fi

        for pkg in "${NPM_PACKAGE}" "${NPM_PACKAGE_NG}"; do
          if [ -z "$(npm view "${pkg}@${RC_VERSION}" version 2>/dev/null || true)" ]; then
            echo "::error::${pkg}@${RC_VERSION} is not on the npm registry - nothing to promote."
            exit 1
          fi
        done

        # Never move `latest` backwards. (Equal is allowed so a failed promotion can be re-run.)
        latest="$(npm view "${NPM_PACKAGE}" dist-tags.latest)"
        newest="$(printf '%s\n' "${latest}" "${release_version}" | sort -V | tail -n 1)"
        if [ "${latest}" != "${release_version}" ] && [ "${newest}" != "${release_version}" ]; then
          echo "::error::${release_version} is older than the current latest (${latest}) - refusing to promote."
          exit 1
        fi

        echo "RELEASE_VERSION=${release_version}" >> "$GITHUB_ENV"
        echo "RC_COMMIT=${rc_commit}" >> "$GITHUB_ENV"
        echo "Promoting ${RC_VERSION} -> ${release_version}" >> "$GITHUB_STEP_SUMMARY"

    - name: Download release candidates from npm registry
      run: |
        mkdir -p promote/core promote/ng
        npm pack "${NPM_PACKAGE}@${RC_VERSION}" --pack-destination "${RUNNER_TEMP}"
        npm pack "${NPM_PACKAGE_NG}@${RC_VERSION}" --pack-destination "${RUNNER_TEMP}"
        tar -xzf "${RUNNER_TEMP}"/ezeep-ezeep-js-*.tgz -C promote/core
        tar -xzf "${RUNNER_TEMP}"/ezeep-ngx-ezeep-js-*.tgz -C promote/ng

    - name: Publish npm package to npm registry (dist-tag latest)
      # --ignore-scripts: the unpacked tarball has no node_modules, so the
      # `prepare` (patch-package) script must not run. Nothing is built here.
      run: |
        if [ -n "$(npm view "${NPM_PACKAGE}@${RELEASE_VERSION}" version 2>/dev/null || true)" ]; then
          echo "${NPM_PACKAGE}@${RELEASE_VERSION} is already published - skipping."
          exit 0
        fi
        npm version --no-git-tag-version "${RELEASE_VERSION}"
        npx -p "${NPM_CLI}" npm publish --access public --provenance --ignore-scripts --tag latest
      working-directory: promote/core/package

    - name: Publish angular library to npm registry (dist-tag latest)
      # The RC was pinned to the RC of the npm package; the release depends on
      # the release it was generated from (or newer).
      run: |
        if [ -n "$(npm view "${NPM_PACKAGE_NG}@${RELEASE_VERSION}" version 2>/dev/null || true)" ]; then
          echo "${NPM_PACKAGE_NG}@${RELEASE_VERSION} is already published - skipping."
          exit 0
        fi
        npm version --no-git-tag-version "${RELEASE_VERSION}"
        npm pkg set "dependencies.${NPM_PACKAGE}=^${RELEASE_VERSION}"
        npx -p "${NPM_CLI}" npm publish --access public --provenance --ignore-scripts --tag latest
      working-directory: promote/ng/package

    - name: Stage CDN files
      # Copied before the zip step below, which writes the zip into DIST_PATH.
      run: |
        mkdir -p artifacts
        cp -R "promote/core/package/${DIST_PATH}" "artifacts/v${RELEASE_VERSION}"

    - name: Zip npm artifact for release
      uses: thedoctor0/zip-release@b57d897cb5d60cb78b51a507f63fa184cfe35554 # 0.7.6
      with:
        type: 'zip'
        directory: promote/core/package/${{ env.DIST_PATH }}
        path: '.'
        filename: ${{ env.ARTIFACT_NAME }}

    - name: Create release with npm package
      uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
      with:
        tag: "${{ env.RELEASE_VERSION }}"
        commit: ${{ env.RC_COMMIT }}
        prerelease: false
        allowUpdates: true
        artifacts: "promote/core/package/${{ env.DIST_PATH }}/${{ env.ARTIFACT_NAME }}"
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Login to Azure CLI via OIDC
      uses: azure/login@v3
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Upload artifact to blob storage
      # --overwrite: a re-run after a failed redirect or purge uploads the same
      # version again, which would otherwise stop with BlobAlreadyExists.
      run: |
          azenv='${{ secrets.AZURE_ENVIRONMENT }}'
          account=$(jq -crM .storage.account <<< $azenv)
          container=$(jq -crM .storage.container <<< $azenv)

          az storage blob upload-batch \
            --auth-mode login \
            --account-name $account \
            -d $container \
            -s "artifacts" \
            --overwrite true \
            -o none

    - name: Update Url redirect
      run: |
          azenv='${{ secrets.AZURE_ENVIRONMENT }}'
          resourceGroup=$(jq -crM .resourceGroup <<< $azenv)
          profile=$(jq -crM .cdn.profileName <<< $azenv)
          endpoint=$(jq -crM .cdn.endpoint.name <<< $azenv)
          rules=$(jq -crM .cdn.endpoint.rules[].name <<< $azenv)
          container=$(jq -crM .storage.container <<< $azenv)

          for rule in $rules; do
            fileName=$(jq -crM --arg rule "$rule" \
              '.cdn.endpoint.rules[]
              | select(.name == $rule)
              | .fileName' \
              <<< $azenv)

            index=$(az cdn endpoint rule action show  \
                  -g $resourceGroup \
                  --profile-name $profile \
                  -n $endpoint \
                  | jq --arg rule "$rule" '.deliveryPolicy.rules[]
                      | select(.name == $rule)
                      | .actions | to_entries | .[]
                      | select(.value.name == "UrlRedirect") | .key' \
                  )

            az cdn endpoint rule action remove \
              -g $resourceGroup \
              --profile-name $profile \
              -n $endpoint \
              --rule-name $rule \
              --index $index \
              -o none

            az cdn endpoint rule action add  \
              -g $resourceGroup \
              --profile-name $profile \
              -n $endpoint \
              --rule-name $rule \
              --action-name UrlRedirect \
              --custom-path "/$container/v${RELEASE_VERSION}/$fileName" \
              --redirect-type Found \
              -o none
          done

    - name: Purge CDN endpoint
      run: |
           azenv='${{ secrets.AZURE_ENVIRONMENT }}'
           resourceGroup=$(jq -crM .resourceGroup <<< $azenv)
           profile=$(jq -crM .cdn.profileName <<< $azenv)
           endpoint=$(jq -crM .cdn.endpoint.name <<< $azenv)
           container=$(jq -crM .storage.container <<< $azenv)

           az cdn endpoint purge \
             -g $resourceGroup \
             --profile-name $profile \
             -n $endpoint \
             --content-paths "/$container/*" \
             --no-wait \
             -o none

    - name: Azure CLI logout
      run: |
        az logout
        az cache purge
        az account clear
      if: always()
